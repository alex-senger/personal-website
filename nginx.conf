server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro emits pretty URLs as directories with index.html files.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    # Hashed build assets are immutable — cache them for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else: revalidate, so content updates show up after a rebuild.
    add_header Cache-Control "public, max-age=600, must-revalidate";

    # Security headers (TLS/HSTS is the reverse proxy's job).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/rss+xml text/plain application/xml;

    # Don't advertise the nginx version.
    server_tokens off;
}
